# Windows CI — proves the bridge actually builds, installs and runs on Windows.
#
# The release workflow cross-compiles the .exe on Linux with zig but never runs
# it (a Windows PE can't execute on the Linux runner). This job closes that gap:
# it runs the shipped binary and the PowerShell installer on a real
# windows-latest host, plus a ConPTY smoke test that spawns Git Bash, sends a
# command, reads its output and tears the process tree down.
#
# Triggers: pushes/PRs that touch Windows-relevant code, and manual dispatch.

name: windows

on:
  push:
    branches: [main]
    paths:
      - '*.c'
      - '*.h'
      - 'install.ps1'
      - 'Makefile'
      - 'test/test_pty_win.c'
      - 'scripts/diagnose-windows.ps1'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - '*.c'
      - '*.h'
      - 'install.ps1'
      - 'Makefile'
      - 'test/test_pty_win.c'
      - 'scripts/diagnose-windows.ps1'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  # ── 1. Build + run the bridge and ConPTY smoke test on real Windows ─────────
  build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout bridge
        uses: actions/checkout@v4
        with:
          path: bridge
          fetch-depth: 0   # `git describe --tags` for BRIDGE_VERSION

      # c-core is a sibling repo (Makefile resolves CORE to ../todoforai-c-core).
      - name: Checkout todoforai-c-core
        uses: actions/checkout@v4
        with:
          repository: todoforai/todoforai-c-core
          path: todoforai-c-core

      - name: Install zig
        uses: mlugg/setup-zig@v2
        timeout-minutes: 5
        with:
          version: 0.13.0

      # Git for Windows ships bash but NOT GNU Make; install it explicitly so
      # `make` is on PATH for the bash-shell steps below.
      - name: Install make
        run: choco install make --no-progress -y

      - name: Build bridge (windows-x64)
        working-directory: bridge
        shell: bash
        run: make release-windows-x64

      # The core of the answer to "does it run on Windows": execute the shipped
      # binary on Windows and assert it starts and reports its version.
      - name: Run bridge --version / --help
        working-directory: bridge
        shell: pwsh
        run: |
          $exe = ".\build\todoforai-bridge-windows-x64.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version exited $LASTEXITCODE" }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "--help exited $LASTEXITCODE" }

      # ConPTY smoke: spawn Git Bash inside a pseudo-console, run a command,
      # read its output, resize, and kill the process tree. Proves pty_win.c.
      # `make test-pty-win` cross-compiles then runs the .exe on this Windows host.
      - name: Build + run ConPTY smoke test
        working-directory: bridge
        shell: bash
        run: |
          make test-pty-win
          ./build/test-pty-win.exe

      # Single-instance lock: without it two bridges flap-loop, each kicking the
      # other off the backend with close code 4000 every ~1s. `-Service` both
      # registers the Scheduled Task AND starts it, so a user who then also runs
      # the bridge in a terminal hits exactly this. Assert the second process
      # refuses to start instead of joining the flap.
      #
      # Uses fake credentials: the lock is taken after creds load and before the
      # first connect, so the second process must hit the lock error and never
      # reach the network. A device that isn't real can't affect the backend.
      #
      # --host must stay a NON-local address: login_is_local_host() switches the
      # credential profile to "dev" for 127.0.0.1/10./192.168./172.16-31, which
      # would bypass the flat creds written below and drop into interactive
      # login. 192.0.2.1 is TEST-NET-1 (RFC 5737) — non-local, never routable,
      # so the connect just retries while the process stays alive holding the lock.
      #
      # Scope: both processes run in the same logon session, so this proves the
      # lock exists and refuses a duplicate — not the cross-session reach that
      # motivated the "Global\" namespace (CI has no second session to test from).
      - name: Single-instance lock refuses a second bridge
        working-directory: bridge
        shell: pwsh
        run: |
          $exe  = (Resolve-Path ".\build\todoforai-bridge-windows-x64.exe").Path
          $cfg  = Join-Path $env:APPDATA 'todoforai'
          New-Item -ItemType Directory -Force -Path $cfg | Out-Null
          # 64 hex chars = a well-formed (but bogus) backend pubkey, so startup
          # gets past the pubkey parse and reaches the lock.
          @{
            deviceId      = 'dev_citestlock'
            deviceSecret  = 'secret'
            backendHost   = '192.0.2.1'
            backendPubkey = ('0' * 64)
            userEmail     = 'ci@example.com'
          } | ConvertTo-Json | Set-Content (Join-Path $cfg 'credentials.json')

          # First instance: holds the mutex. Unroutable host ⇒ it sits in the
          # connect/retry loop and stays alive while we race the second one.
          $first  = Start-Process $exe -ArgumentList '--host','192.0.2.1','--port','80' `
                      -PassThru -WindowStyle Hidden
          $second = $null
          try {
              Start-Sleep -Seconds 3
              if ($first.HasExited) { throw "first bridge exited early (rc=$($first.ExitCode))" }

              # Never run the second instance synchronously: if the lock is
              # broken it enters the reconnect loop and never returns, hanging
              # the job until its timeout instead of failing. Bound the wait.
              $log    = Join-Path $env:RUNNER_TEMP 'second.log'
              $second = Start-Process $exe -ArgumentList '--host','192.0.2.1','--port','80' `
                          -PassThru -WindowStyle Hidden `
                          -RedirectStandardError $log -RedirectStandardOutput "$log.out"
              if (-not $second.WaitForExit(15000)) {
                  throw "second bridge was still running after 15s — the lock is NOT holding"
              }
              $out = ((Get-Content $log -Raw -EA SilentlyContinue) +
                      (Get-Content "$log.out" -Raw -EA SilentlyContinue))
              Write-Host "second instance rc=$($second.ExitCode) output:`n$out"
              if ($second.ExitCode -eq 0)           { throw "second bridge exited 0 — lock is not holding" }
              if ($out -notmatch 'already running') { throw "second bridge failed for the wrong reason:`n$out" }
              Write-Host "OK: second instance refused by the device lock"
          } finally {
              # Both, unconditionally: an exception anywhere in the try (including
              # inside WaitForExit) must not leave a bridge running into later steps.
              foreach ($p in @($first, $second)) {
                  if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force }
              }
              Remove-Item (Join-Path $cfg 'credentials.json') -ErrorAction SilentlyContinue
          }

      # The diagnostic advertises Windows PowerShell 5.1 support, so parse it with
      # 5.1 (powershell.exe), not the pwsh 7 the steps above use. Parse-only: the
      # script inspects live machine state, which CI doesn't have.
      - name: Diagnostic script parses under PowerShell 5.1
        working-directory: bridge
        shell: powershell
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path '.\scripts\diagnose-windows.ps1').Path, [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { Write-Host $_ }; throw "$($errs.Count) parse error(s)" }
          Write-Host "OK: parses clean under PS $($PSVersionTable.PSVersion)"

  # ── 2. Exercise the PowerShell installer end-to-end on Windows ──────────────
  # Installs the latest published release via install.ps1 (custom -Prefix that
  # is pre-added to $env:PATH so the installer takes the non-persistent branch
  # and never mutates the runner's user PATH), then runs the installed exe.
  # This is the real "is it installable and runnable on Windows?" check: it
  # downloads the shipped release, verifies its sha256, and executes it — a
  # SmartScreen/cert/AV block or a bad binary would surface here.
  installer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bridge
        uses: actions/checkout@v4

      - name: Run install.ps1 (custom prefix, latest release)
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'tfa-bin'
          New-Item -ItemType Directory -Force -Path $prefix | Out-Null
          # Pre-add prefix to the session PATH → installer skips persistent PATH edit.
          $env:Path = "$prefix;$env:Path"
          .\install.ps1 -Prefix $prefix
          $exe = Join-Path $prefix 'todoforai-bridge.exe'
          if (-not (Test-Path $exe)) { throw "installer did not place $exe" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "installed bridge --version exited $LASTEXITCODE" }
